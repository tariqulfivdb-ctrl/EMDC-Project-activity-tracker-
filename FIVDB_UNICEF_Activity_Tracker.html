<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FIVDB × UNICEF – EMDC Activity Tracker</title>
<style>
:root{--bg:#f4f8fb;--card:#fff;--tx:#12263a;--mu:#5b6f82;--bd:#dbe5ee;--un:#1cabe2;--gr:#2e9e5b;--am:#e8a317;--rd:#c8c8c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1822;--card:#16232f;--tx:#e6eef5;--mu:#92a6b8;--bd:#263745;--rd:#3a4a58}}
:root[data-theme=dark]{--bg:#0e1822;--card:#16232f;--tx:#e6eef5;--mu:#92a6b8;--bd:#263745;--rd:#3a4a58}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{background:linear-gradient(135deg,#0b5f8a,#1cabe2);color:#fff;padding:36px 20px 70px;text-align:center}
.logos{display:flex;gap:clamp(8px,2.5vw,28px);justify-content:center;align-items:center;flex-wrap:nowrap}.logos img{max-width:23vw;object-fit:contain}
.logos img{height:clamp(60px,12vw,110px);width:clamp(60px,12vw,110px);border-radius:50%;border:4px solid #fff;background:#fff}.logos img.rl{width:auto;border-radius:10px;border:0;height:clamp(50px,10vw,90px)}
.wm{background:#fff;border-radius:12px;padding:10px 18px;font-weight:800;font-size:26px;letter-spacing:1px}
.wm.f{color:#0b5f8a}.wm.u{color:#1cabe2;text-transform:lowercase;font-size:30px}
.x{font-size:24px;opacity:.8}
h1{margin:18px 0 6px;font-size:clamp(22px,5vw,36px)}.hero p{margin:4px auto;max-width:720px;opacity:.95}
.btn{display:inline-block;margin-top:16px;background:#fff;color:#0b5f8a;padding:10px 22px;border-radius:30px;font-weight:700;text-decoration:none}
main{max-width:1180px;margin:-44px auto 40px;padding:0 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:26px}.stat span{color:var(--mu);font-size:13px}
.bar{height:10px;background:var(--rd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gr)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.tools input,.tools select,.tools button{font:inherit;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.tools input{flex:1;min-width:180px}.tools button{cursor:pointer}
.out{margin-bottom:16px}.out h2{font-size:16px;margin:0 0 4px}.out .sub{color:var(--mu);font-size:13px;margin-bottom:8px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle;font-size:13px}
th{color:var(--mu);font-weight:600;position:sticky;top:0;background:var(--card)}
.id{font-weight:700;white-space:nowrap}.g{white-space:nowrap}
.q{display:inline-block;width:11px;height:16px;margin-right:1px;border-radius:2px;background:var(--bd)}
.q.on{background:var(--un)}.q.now{outline:2px solid var(--am)}
select.st{padding:4px 6px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:12px}
.st.d1{border-color:var(--am)}.st.d2{border-color:var(--gr);color:var(--gr)}
input.pc{width:58px;padding:4px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
input.nt{width:100%;min-width:130px;padding:4px 6px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
footer{text-align:center;color:var(--mu);font-size:12px;padding:10px}
.r1{gap:clamp(12px,3vw,32px)}.r1 img,.r1 img.rl{width:clamp(88px,26vw,190px);height:clamp(66px,19vw,130px);max-width:none;object-fit:contain;background:#fff;border:0;border-radius:12px;padding:6px}</style></head><body>
